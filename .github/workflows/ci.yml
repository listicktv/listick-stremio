# Every push and pull request: syntax, the tests, and an image build. Images are published by releases (release.yml).
name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - run: docker build -t listick-stremio .
